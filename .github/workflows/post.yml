name: C.F. España Instagram post

on:
  schedule:
    - cron: '0 7 * * 1'   # Dilluns   09:00 Zúrich → email + post + story
    - cron: '0 7 * * 3'   # Dimecres  09:00 Zúrich → story (+ post si hi ha canvis)
    - cron: '0 7 * * 5'   # Divendres 09:00 Zúrich → story (+ post si hi ha canvis)
    - cron: '0 19 * * 0'  # Diumenge  21:00 Zúrich → email + resultats + story
  workflow_dispatch:
    inputs:
      mode:
        description: 'Què vols publicar'
        type: choice
        options: [preview, results, story_only]
        default: preview
        required: true

# Evita que dues execucions es trepitgin el push del cache
concurrency:
  group: cfespana-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·lar dependències
        # curl_cffi és imprescindible: el matchcenter bloqueja python-requests
        # per l'empremta TLS i retorna 403 abans de mirar cap capçalera.
        run: pip install pillow requests beautifulsoup4 curl_cffi

      - name: Decidir mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 19 * * 0" ]; then
            MODE="results"
          elif [ "${{ github.event.schedule }}" = "0 7 * * 1" ]; then
            MODE="preview"
          else
            MODE="story_only"
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          # cfespana_post.py només accepta preview o results;
          # story_only reutilitza la imatge de preview.
          if [ "$MODE" = "results" ]; then
            echo "gen=results" >> $GITHUB_OUTPUT
          else
            echo "gen=preview" >> $GITHUB_OUTPUT
          fi
          echo "Mode: $MODE"

      - name: Netejar sortides anteriors
        # Sense això, out/*.png acumula els PNG de setmanes anteriors i el
        # bucle de publicació els torna a penjar tots.
        run: |
          mkdir -p out cache
          rm -f out/*.png out/*.txt

      - name: Generar imatge i text
        run: python cfespana_post.py ${{ steps.mode.outputs.gen }}

      - name: Publicar les imatges al repositori
        # Cal fer-ho ABANS de publicar: Buffer necessita un URL públic de la
        # imatge, i el servim des del propi repo via raw.githubusercontent.
        run: |
          mkdir -p out cache
          git config user.name  "cfespana-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f out/ cache/
          if git diff --staged --quiet; then
            echo "res a desar"
          else
            git commit -m "imatges: ${{ steps.mode.outputs.mode }} $(date +%F) [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Enviar per email i publicar
        env:
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          BUFFER_TOKEN:       ${{ secrets.BUFFER_TOKEN }}
          BUFFER_CHANNEL_ID:  ${{ secrets.BUFFER_CHANNEL_ID }}
          IMGUR_CLIENT_ID:    ${{ secrets.IMGUR_CLIENT_ID }}
          IMAGE_BASE_URL:     https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/out
        run: |
          shopt -s nullglob
          for f in out/*.png; do
            python publish.py "$f" "${{ steps.mode.outputs.mode }}"
          done

      - name: Desar cache al repositori
        # Va al final i amb always(): el cache d'actes i les instantànies del
        # calendari es guarden encara que la publicació hagi petat. Sense
        # aquest commit el cache s'esborra entre execucions i es perden els
        # partits de principi de setmana.
        if: always()
        run: |
          mkdir -p cache out
          git config user.name  "cfespana-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f cache/ out/
          if git diff --staged --quiet; then
            echo "res a desar"
          else
            git commit -m "cache: ${{ steps.mode.outputs.mode }} $(date +%F) [skip ci]"
            git pull --rebase --autostash
            git push
          fi
