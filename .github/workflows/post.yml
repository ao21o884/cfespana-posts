name: C.F. España Instagram post

on:
  schedule:
    - cron: '0 7 * * 1'   # Dilluns 09:00 Zúrich → partits
    - cron: '0 19 * * 0'  # Diumenge 21:00 Zúrich → resultats
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview o results'
        default: preview
        required: true

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·lar dependències
        run: pip install pillow requests beautifulsoup4

      - name: Descarregar calendari de partits actualitzat
        run: |
          curl -L "https://matchcenter.fvbj-afbj.ch/default.aspx?v=1368&oid=6&lng=1&a=kal" \
               -o Verein-v1368.ics \
               -H "User-Agent: CFEspanaBern-Matchposts/1.0"
          echo "Calendari descarregat: $(wc -l < Verein-v1368.ics) línies"

      - name: Decidir mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 19 * * 0" ]; then
            echo "mode=results" >> $GITHUB_OUTPUT
          else
            echo "mode=preview" >> $GITHUB_OUTPUT
          fi

      - name: Generar imatge i text
        run: python cfespana_post.py ${{ steps.mode.outputs.mode }}

      - name: Guardar al repositori
        run: |
          git config user.name  "cfespana-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/ cache/ || true
          git commit -m "post: ${{ steps.mode.outputs.mode }} $(date +%F)" || true
          git push

      - name: Enviar per email
        env:
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          IG_USER_ID:     ${{ secrets.IG_USER_ID }}
          IG_TOKEN:       ${{ secrets.IG_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/out
        run: |
          for f in out/*.png; do python publish.py "$f"; done
